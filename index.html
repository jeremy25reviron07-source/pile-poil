<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pile Poil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap">
<style>
/* Single-look arcade screen: dark site at night around a 16:9 game canvas */
:root{--bg:#0b1020;--fg:#e6eef8;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Inter,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;max-width:100%;max-height:100%;outline:none}
</style>
</head><body>
<canvas id="c" width="1920" height="1080" tabindex="0" aria-label="Jeu Pile Poil : grue de chantier"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>

const W=1920,H=1080;
let c=document.getElementById('c').getContext('2d');

// seeded random
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();};
const lg=(x0,y0,x1,y1,stops)=>{const g=c.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;};
const rg=(x,y,r0,r1,stops)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,col])=>g.addColorStop(o,col));return g;};
function fillR(x,y,w,h,f){c.fillStyle=f;c.fillRect(x,y,w,h);}
function ln(x0,y0,x1,y1,col,lw){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function ell(x,y,rx,ry,f){c.fillStyle=f;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill();}
function withShadow(col,blur,ox,oy,fn){c.save();c.shadowColor=col;c.shadowBlur=blur;c.shadowOffsetX=ox;c.shadowOffsetY=oy;fn();c.restore();}
function blurred(px,fn){c.save();c.filter=`blur(${px}px)`;fn();c.restore();}
function speckle(x,y,w,h,cols,n,s0,s1){for(let i=0;i<n;i++){const px=x+rnd()*w,py=y+rnd()*h,s=s0+rnd()*(s1-s0);ell(px,py,s,s*0.6,cols[i%cols.length]);}}

// ---------------- SKY & ATMOSPHERE ----------------
function sky(stops){fillR(0,0,W,H,lg(0,0,0,H,stops));}
function sunGlow(x,y,r,col,glow){fillR(0,0,W,H,rg(x,y,0,r*6,[[0,glow],[1,'rgba(0,0,0,0)']]));ell(x,y,r,r,col);}
function cloud(x,y,s,col='rgba(255,255,255,.95)',shade='rgba(190,210,235,.6)'){
  blurred(1.5,()=>{[[0,0,1],[60,-25,.8],[120,-5,.9],[170,10,.6],[-50,12,.6]].forEach(([dx,dy,k])=>{ell(x+dx*s,y+dy*s+10*s,60*k*s,30*k*s,shade);});
  [[0,0,1],[60,-25,.8],[120,-5,.9],[170,10,.6],[-50,12,.6]].forEach(([dx,dy,k])=>{ell(x+dx*s,y+dy*s,60*k*s,34*k*s,col);});});
}

// ---------------- GROUND & HOLES ----------------
function dirtGround(gy,top='#8b5a2b',bot='#4a2d14',grass=null){
  fillR(0,gy,W,H-gy,lg(0,gy,0,H,[[0,top],[1,bot]]));
  speckle(0,gy+10,W,H-gy,['rgba(255,220,170,.10)','rgba(40,20,5,.18)','rgba(120,80,40,.25)'],900,2,6);
  for(let i=0;i<60;i++){const x=rnd()*W,y=gy+20+rnd()*(H-gy-20),s=4+rnd()*8;ell(x,y,s,s*.7,'rgba(150,140,130,.55)');ell(x-s*.3,y-s*.3,s*.4,s*.25,'rgba(255,255,255,.25)');}
  if(grass){fillR(0,gy-6,W,18,lg(0,gy-6,0,gy+12,[[0,grass[0]],[1,grass[1]]]));c.strokeStyle=grass[0];c.lineWidth=2;for(let x=0;x<W;x+=5){const h=6+rnd()*12;c.beginPath();c.moveTo(x,gy+4);c.lineTo(x+(rnd()-.5)*6,gy-h);c.stroke();}}
}
function hole(x,w,gy,depth,{wall='#5b3a1c',inner='#1a0f07',layers=['#7a4f27','#6b4320','#5a381a']}={}){
  // opening
  fillR(x,gy,w,depth,lg(0,gy,0,gy+depth,[[0,inner],[1,'#000']]));
  // back wall with strata
  const bw=Math.min(36,depth*.35);layers.forEach((col,i)=>fillR(x,gy+i*bw/layers.length,w,bw/layers.length+1,col));
  fillR(x,gy+bw,w,14,lg(0,gy+bw,0,gy+bw+14,[[0,'rgba(0,0,0,.55)'],[1,'rgba(0,0,0,0)']]));
  // side walls
  c.fillStyle=lg(x,0,x+16,0,[[0,'rgba(140,95,50,.6)'],[1,'rgba(0,0,0,0)']]);c.fillRect(x,gy,16,depth);
  c.fillStyle=lg(x+w-16,0,x+w,0,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.6)']]);c.fillRect(x+w-16,gy,16,depth);
  // lip
  fillR(x-4,gy-3,w+8,5,'rgba(255,230,190,.25)');
}
function targetMark(x,w,gy,depth,t=0){
  c.save();c.shadowColor='#36f59a';c.shadowBlur=24;c.strokeStyle='#3cf29b';c.lineWidth=6;c.setLineDash([22,12]);
  rr(x-12,gy-12,w+24,depth+18,12);c.stroke();c.restore();
  const ax=x+w/2,ay=gy-110;
  withShadow('#36f59a',28,0,0,()=>{c.fillStyle=lg(0,ay,0,ay+56,[[0,'#7dffc0'],[1,'#1ec97a']]);c.beginPath();c.moveTo(ax-34,ay);c.lineTo(ax+34,ay);c.lineTo(ax,ay+50);c.closePath();c.fill();});
}
function dropLine(x,y0,y1){c.save();c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=4;c.setLineDash([14,14]);ln(x,y0,x,y1,'rgba(255,255,255,.85)',4);c.restore();}
function groundShadow(x,gy,w){ell(x,gy+6,w*.55,10,'rgba(0,0,0,.28)');}

// ---------------- LOADS ----------------
function concreteBlock(cx,top,w=170,h=100,frost=false){
  withShadow('rgba(0,0,0,.35)',18,6,10,()=>{rr(cx-w/2,top,w,h,8);c.fillStyle=lg(0,top,0,top+h,[[0,'#c9d0d6'],[.5,'#a9b1b9'],[1,'#7f8892']]);c.fill();});
  c.save();rr(cx-w/2,top,w,h,8);c.clip();speckle(cx-w/2,top,w,h,['rgba(60,70,80,.35)','rgba(255,255,255,.25)'],140,1,3);
  ln(cx-w*.2,top+h*.3,cx-w*.05,top+h*.55,'rgba(70,80,90,.5)',2);ln(cx-w*.05,top+h*.55,cx+w*.02,top+h*.5,'rgba(70,80,90,.5)',2);
  fillR(cx-w/2,top+h-10,w,10,'rgba(0,0,0,.18)');c.restore();
  if(frost){c.fillStyle='rgba(255,255,255,.95)';rr(cx-w/2-2,top-6,w+4,14,7);c.fill();for(let i=0;i<8;i++)ell(cx-w/2+10+i*w/8,top+8,6,8+rnd()*6,'rgba(255,255,255,.9)');}
  // lifting loops
  [-w*.3,w*.3].forEach(dx=>{c.strokeStyle='#2b2f36';c.lineWidth=5;c.beginPath();c.arc(cx+dx,top,10,Math.PI,0);c.stroke();});
}
function pallet(cx,top,w=150){
  const h=110;
  withShadow('rgba(0,0,0,.35)',16,5,8,()=>{
    // blocks wrapped
    for(let r=0;r<3;r++)for(let k=0;k<3;k++){const bx=cx-w/2+6+k*(w-12)/3,by=top+r*30;rr(bx,by,(w-12)/3-4,26,3);c.fillStyle=lg(0,by,0,by+26,[[0,'#d3d7db'],[1,'#9aa1a8']]);c.fill();
      fillR(bx+8,by+6,(w-12)/3-20,6,'rgba(90,95,100,.45)');}
  });
  fillR(cx-w/2,top+90,w,8,lg(0,top+90,0,top+98,[[0,'#c99a63'],[1,'#8a6234']]));
  [0,.45,.9].forEach(k=>fillR(cx-w/2+k*(w-14),top+98,14,12,'#7a5530'));fillR(cx-w/2,top+108,w,6,'#a57744');
  c.fillStyle='rgba(220,235,255,.18)';c.fillRect(cx-w/2+4,top-2,w-8,92);
  [-w*.42,w*.42].forEach(dx=>ln(cx+dx,top,cx+dx,top+88,'rgba(255,255,255,.35)',3));
}
function container(cx,top,base='#d9622b',w=300,h=120){
  withShadow('rgba(0,0,0,.4)',20,6,12,()=>{c.fillStyle=lg(0,top,0,top+h,[[0,base],[1,shade(base,-40)]]);c.fillRect(cx-w/2,top,w,h);});
  for(let x=cx-w/2+10;x<cx+w/2-10;x+=12){fillR(x,top+8,5,h-16,'rgba(255,255,255,.12)');fillR(x+6,top+8,3,h-16,'rgba(0,0,0,.18)');}
  fillR(cx-w/2,top,w,8,shade(base,25));fillR(cx-w/2,top+h-8,w,8,shade(base,-55));
  [[cx-w/2,top],[cx+w/2-14,top],[cx-w/2,top+h-14],[cx+w/2-14,top+h-14]].forEach(([x,y])=>fillR(x,y,14,14,'#3a3f47'));
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return `rgb(${r},${g},${b})`;}
function pipe(cx,top,w=300,h=64){
  withShadow('rgba(0,0,0,.35)',16,6,10,()=>{c.fillStyle=lg(0,top,0,top+h,[[0,'#5b6570'],[.25,'#c7d0d8'],[.5,'#8a959f'],[1,'#3f4851']]);c.fillRect(cx-w/2,top,w,h);});
  ell(cx+w/2,top+h/2,10,h/2,'#4a535d');ell(cx+w/2,top+h/2,6,h/2-8,'#1d2228');ell(cx-w/2,top+h/2,10,h/2,'#6b7681');
  fillR(cx-w/2+30,top,6,h,'rgba(0,0,0,.25)');fillR(cx+w/2-36,top,6,h,'rgba(0,0,0,.25)');
  speckle(cx-w/2,top,w,h,['rgba(150,90,40,.25)'],40,1,3);
}
function ibeam(cx,top,w=320){
  const h=70;withShadow('rgba(0,0,0,.4)',18,6,10,()=>{
    c.fillStyle=lg(0,top,0,top+14,[[0,'#e2553e'],[1,'#9e2c1c']]);c.fillRect(cx-w/2,top,w,14);
    c.fillStyle=lg(0,top+14,0,top+h-14,[[0,'#6e1e13'],[1,'#a83322']]);c.fillRect(cx-w/2+6,top+14,w-12,h-28);
    c.fillStyle=lg(0,top+h-14,0,top+h,[[0,'#d1462f'],[1,'#7a2214']]);c.fillRect(cx-w/2,top+h-14,w,14);});
  for(let x=cx-w/2+30;x<cx+w/2-20;x+=60){ell(x,top+h/2,6,6,'#3b120b');}
}
function slings(hx,hy,cx,top,w){c.strokeStyle='#2a2d33';c.lineWidth=4;[-w*.38,w*.38].forEach(dx=>{c.beginPath();c.moveTo(hx,hy);c.lineTo(cx+dx,top+2);c.stroke();});}
function hookBlock(x,y,col='#d93b2b'){
  withShadow('rgba(0,0,0,.35)',10,3,6,()=>{rr(x-26,y,52,46,8);c.fillStyle=lg(x-26,0,x+26,0,[[0,shade(col,30)],[.5,col],[1,shade(col,-50)]]);c.fill();});
  ell(x,y+16,12,12,'#2b2f36');ell(x,y+16,5,5,'#9aa3ad');
  fillR(x-14,y+30,28,5,'rgba(255,220,0,.85)');for(let i=0;i<4;i++)fillR(x-12+i*8,y+30,4,5,'#222');
  c.strokeStyle='#2b2f36';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(x,y+46);c.lineTo(x,y+60);c.arc(x-10,y+64,12,0,Math.PI*1.1);c.stroke();c.lineCap='butt';
  return y+66;
}
function cables(x0,y0,x1,y1){ln(x0-6,y0,x1-6,y1,'#1d2026',3);ln(x0+6,y0,x1+6,y1,'#1d2026',3);ln(x0-5,y0,x1-5,y1,'rgba(255,255,255,.25)',1);}

// ---------------- CRANE PARTS ----------------
function trussH(x0,x1,y,h,col,dark,lw=4,step=null){
  step=step||h;
  c.save();c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=6;c.shadowOffsetY=5;
  ln(x0,y,x1,y,col,lw*1.8);ln(x0,y+h,x1,y+h,col,lw*1.8);
  for(let x=x0;x<x1;x+=step){ln(x,y,x,y+h,col,lw);ln(x,y+h,Math.min(x+step,x1),y,dark,lw*.8);}
  c.restore();ln(x0,y-lw*.6,x1,y-lw*.6,'rgba(255,255,255,.45)',1.5);
}
function trussV(x,y0,y1,w,col,dark,lw=4){
  c.save();c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=6;c.shadowOffsetX=5;
  ln(x,y0,x,y1,col,lw*1.8);ln(x+w,y0,x+w,y1,col,lw*1.8);
  for(let y=y0;y<y1;y+=w){ln(x,y,x+w,y,col,lw);ln(x,y,x+w,Math.min(y+w,y1),dark,lw*.8);ln(x+w,y,x,Math.min(y+w,y1),shade2(dark),lw*.5);}
  c.restore();ln(x-lw*.6,y0,x-lw*.6,y1,'rgba(255,255,255,.4)',1.5);
}
function shade2(col){return 'rgba(0,0,0,.25)';}
function towerCrane({mx,gy,jt,jibL,jibR,col='#f6b81a',dark='#b9820a',mastW=56,base=true,snow=false,light=false,cabCol=null}){
  // tie rods
  const apexY=jt-150, ax=mx+mastW/2;
  ln(ax,apexY,jibR-80,jt,'#cfd6de',3);ln(ax,apexY,jibR*0.55+mx*0.45,jt,'#cfd6de',3);ln(ax,apexY,jibL+30,jt,'#cfd6de',3);
  // mast
  trussV(mx,jt,gy-(base?30:0),mastW,col,dark,4);
  if(base){withShadow('rgba(0,0,0,.4)',12,0,6,()=>{c.fillStyle=lg(0,gy-34,0,gy,[[0,'#6b7480'],[1,'#3a4048']]);c.fillRect(mx-60,gy-34,mastW+120,34);});}
  // apex
  c.save();c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=6;ln(mx,jt,ax,apexY,col,7);ln(mx+mastW,jt,ax,apexY,col,7);ln(mx+8,jt-40,mx+mastW-8,jt-40,col,4);ln(mx+18,jt-90,mx+mastW-18,jt-90,col,4);c.restore();
  if(light){withShadow('#ff2b2b',30,0,0,()=>ell(ax,apexY-8,9,9,'#ff4a3a'));}
  // jib & counter-jib
  trussH(mx+mastW,jibR,jt,46,col,dark,4);trussH(jibL,mx,jt,46,col,dark,4);
  // slewing ring
  fillR(mx-10,jt+46,mastW+20,16,'#3f4650');
  // counterweights
  for(let i=0;i<4;i++){const x=jibL+14+i*36;withShadow('rgba(0,0,0,.35)',10,4,6,()=>{c.fillStyle=lg(x,0,x+34,0,[[0,'#b5bcc4'],[1,'#7d858f']]);c.fillRect(x,jt+48,32,90);});}
  // cab
  const cx0=mx+mastW+6,cy0=jt+50;
  withShadow('rgba(0,0,0,.35)',10,4,6,()=>{rr(cx0,cy0,74,70,10);c.fillStyle=lg(0,cy0,0,cy0+70,[[0,cabCol||shade(col,20)],[1,dark]]);c.fill();});
  rr(cx0+10,cy0+10,54,34,6);c.fillStyle=lg(cx0,cy0,cx0+60,cy0+40,[[0,'#d9f2ff'],[.5,'#7fb8de'],[1,'#3b6f96']]);c.fill();
  ln(cx0+16,cy0+40,cx0+40,cy0+14,'rgba(255,255,255,.6)',3);
  if(snow){c.fillStyle='rgba(255,255,255,.95)';for(let x=jibL;x<jibR;x+=10){ell(x,jt-3,7,4+rnd()*3,'rgba(255,255,255,.95)');}rr(jibL+14,jt+40,144,10,5);c.fill();rr(cx0-2,cy0-6,78,12,6);c.fill();}
}
function trolley(x,jt,col='#d93b2b'){withShadow('rgba(0,0,0,.35)',8,2,5,()=>{rr(x-40,jt+48,80,26,5);c.fillStyle=lg(0,jt+48,0,jt+74,[[0,shade(col,30)],[1,shade(col,-40)]]);c.fill();});ell(x-24,jt+48,9,9,'#2b2f36');ell(x+24,jt+48,9,9,'#2b2f36');return jt+74;}

// ---------------- BACKGROUND HELPERS ----------------
function hills(y,amp,col,freq,ph){c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=20)c.lineTo(x,y+Math.sin(x*freq+ph)*amp+Math.sin(x*freq*2.7+ph*2)*amp*.35);c.lineTo(W,H);c.fill();}
function tree(x,gy,s,cols=['#2f6b2a','#3f8a35','#58a845']){
  fillR(x-6*s,gy-60*s,12*s,60*s,lg(x-6*s,0,x+6*s,0,[[0,'#5a3c22'],[1,'#3a2614']]));
  [[0,-90,46,cols[0]],[-26,-70,34,cols[0]],[24,-72,36,cols[0]],[-8,-100,36,cols[1]],[16,-86,30,cols[1]],[-18,-82,26,cols[1]],[2,-112,22,cols[2]],[-20,-98,14,cols[2]]].forEach(([dx,dy,r,col])=>ell(x+dx*s,gy+dy*s,r*s,r*s*.9,col));
}
function pine(x,gy,s,col='#2c4f3a',snow=true){fillR(x-4*s,gy-20*s,8*s,20*s,'#3a2a1c');for(let i=0;i<4;i++){const w=(44-i*9)*s,y=gy-20*s-i*22*s;c.fillStyle=col;c.beginPath();c.moveTo(x-w,y);c.lineTo(x+w,y);c.lineTo(x,y-34*s);c.closePath();c.fill();if(snow){c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.moveTo(x-w*.5,y-17*s);c.lineTo(x+w*.4,y-17*s);c.lineTo(x,y-34*s);c.fill();}}}
function house(x,gy,w,h,wall,roof){
  withShadow('rgba(0,0,0,.25)',14,6,6,()=>{c.fillStyle=lg(0,gy-h,0,gy,[[0,wall],[1,shade(wall,-30)]]);c.fillRect(x,gy-h,w,h);});
  c.fillStyle=lg(0,gy-h-w*.45,0,gy-h,[[0,shade(roof,25)],[1,shade(roof,-30)]]);c.beginPath();c.moveTo(x-16,gy-h);c.lineTo(x+w/2,gy-h-w*.42);c.lineTo(x+w+16,gy-h);c.closePath();c.fill();
  for(let r=0;r<5;r++){ln(x-16+r*6,gy-h-r*w*.08,x+w+16-r*6,gy-h-r*w*.08,'rgba(0,0,0,.12)',2);}
  [[.18,.35],[.62,.35]].forEach(([kx,ky])=>{const wx=x+w*kx,wy=gy-h+h*ky*.6;rr(wx,wy,w*.2,h*.26,3);c.fillStyle=lg(wx,wy,wx+w*.2,wy+h*.26,[[0,'#e8f6ff'],[1,'#7aa6c6']]);c.fill();ln(wx+w*.1,wy,wx+w*.1,wy+h*.26,'#fff',3);});
  rr(x+w*.42,gy-h*.48,w*.16,h*.48,3);c.fillStyle='#6b4428';c.fill();
}
function building(x,gy,w,h,col,winCol,lit=0.5){c.fillStyle=lg(x,0,x+w,0,[[0,shade(col,15)],[1,shade(col,-20)]]);c.fillRect(x,gy-h,w,h);for(let yy=gy-h+16;yy<gy-14;yy+=26)for(let xx=x+12;xx<x+w-18;xx+=24){c.fillStyle=rnd()<lit?winCol:'rgba(0,0,0,.18)';c.fillRect(xx,yy,12,14);}}

// ---------------- HUD ----------------
function panel(x,y,w,h){c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=20;c.shadowOffsetY=6;rr(x,y,w,h,22);c.fillStyle='rgba(12,18,32,.72)';c.fill();c.restore();rr(x,y,w,h,22);c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;c.stroke();}
function txt(s,x,y,col,size,weight=800,align='left',font='Inter'){c.fillStyle=col;c.font=`${weight} ${size}px ${font}`;c.textAlign=align;c.fillText(s,x,y);c.textAlign='left';}

function helmet(x,y,s,on){

  withShadow('rgba(0,0,0,.4)',on?8:0,0,3,()=>{c.fillStyle=on?lg(x-26*s,y-30*s,x+26*s,y,[[0,'#ffe27a'],[.6,col],[1,d]]):col;c.beginPath();c.ellipse(x,y,26*s,26*s,0,Math.PI,0);c.fill();});
  c.fillStyle=d;c.beginPath();c.ellipse(x+4*s,y,36*s,7*s,0,0,Math.PI*2);c.fill();
  fillR(x-4*s,y-26*s,8*s,24*s,on?'rgba(255,255,255,.35)':'rgba(255,255,255,.06)');
}

function hudB({niv,tranche,lives,score,meteo,power,speed}){
  // level panel
  panel(36,30,470,122);
  txt('NIVEAU',66,70,'#ffc21a',22);txt(String(niv),66,124,'#fff',58,900);
  c.font='900 58px Inter';const nw=c.measureText(String(niv)).width;txt('/50',72+nw,124,'rgba(255,255,255,.55)',30,800);
  txt(tranche.toUpperCase(),210,70,'#cfe0ff',19,800);
  const t0=Math.floor((niv-1)/10)*10+1;
  for(let i=0;i<10;i++){const lvl=t0+i,x=210+i*27,y=92;rr(x,y,21,26,5);c.fillStyle=lvl<niv?'#2bd67b':lvl===niv?'#ffc21a':'rgba(255,255,255,.14)';c.fill();}
  txt(`Checkpoint : niv. ${t0===1?1:t0}`,210,144,'rgba(255,255,255,.55)',15,700);
  // lives
  panel(522,30,250,122);txt('VIES',552,70,'#ffc21a',22);
  for(let i=0;i<3;i++)helmet(582+i*70,126,.85,i<lives);
  // logo
  withShadow('rgba(0,0,0,.5)',16,0,4,()=>{txt('PILE POIL',960,92,'#ffc21a',58,900,'center');});
  txt('ADRESSE & PRÉCISION',960,124,'rgba(255,255,255,.85)',17,800,'center');
  // score
  panel(1530,30,354,122);txt('SCORE',1560,70,'#ffc21a',22);txt(score,1560,126,'#fff',52,900);
  // weather
  const mh=46+meteo.length*50;panel(1530,166,354,mh);txt('CONDITIONS',1560,202,'#ffc21a',20);
  meteo.forEach(([ic,label,val],i)=>{const y=244+i*50;ICONS[ic](1582,y);txt(label,1622,y+8,'#fff',22,800);if(val)txt(val,1856,y+8,'#9fd6ff',22,900,'right');});
  // power gauge
  const gx=1812,gy0=200+mh+40,gy1=Math.min(gy0+400,900);
  panel(gx-22,gy0-50,100,gy1-gy0+120);
  txt('PUISSANCE',gx+28,gy0-18,'#ffc21a',13,900,'center');
  rr(gx,gy0,56,gy1-gy0,14);c.fillStyle='rgba(0,0,0,.45)';c.fill();
  const fh=(gy1-gy0)*power;c.save();rr(gx,gy0,56,gy1-gy0,14);c.clip();
  fillR(gx,gy1-fh,56,fh,lg(0,gy1,0,gy0,[[0,'#2bd67b'],[.55,'#ffd447'],[1,'#ff4a3a']]));
  for(let y=gy0+20;y<gy1;y+=20)fillR(gx,y,56,2,'rgba(0,0,0,.25)');c.restore();
  withShadow('rgba(255,255,255,.8)',10,0,0,()=>{fillR(gx-10,gy1-fh-3,76,6,'#fff');});
  txt(Math.round(power*100)+'%',gx+28,gy1+40,'#fff',26,900,'center');
  // speed (optional)
  if(speed){panel(36,166,380,64);txt('VITESSE GRUE',62,206,'#ffc21a',18);txt(speed,396,208,speed.includes('↑')?'#ff8a6a':'#9fd6ff',26,900,'right');}
  // controls bar
  const items=[['← → ↑ ↓','Déplacer'],['ESPACE maintenu','Puissance'],['ESPACE relâché','Lâcher'],['ÉCHAP','Pause']];
  c.font='800 20px Inter';let total=0;const ws=items.map(([k,l])=>{c.font='900 18px Inter';const kw=c.measureText(k).width+28;c.font='700 20px Inter';const lw=c.measureText(l).width;total+=kw+lw+44;return [kw,lw];});
  let x=960-total/2;panel(x-16,1004,total+12,56);
  items.forEach(([k,l],i)=>{const [kw,lw]=ws[i];rr(x,1015,kw,34,8);c.fillStyle='rgba(255,255,255,.92)';c.fill();txt(k,x+kw/2,1039,'#121a2c',18,900,'center');txt(l,x+kw+10,1040,'#e6eef8',20,700);x+=kw+lw+44;});
}
function trajectory(x0,y0,x1,y1,lift,bend=0){
  c.save();c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=5;c.setLineDash([4,14]);c.lineCap='round';c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=6;
  c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo((x0+x1)/2+bend,Math.min(y0,y1)-lift,x1,y1);c.stroke();c.restore();
}
function target(x,w,gy,depth,label=true){
  c.save();c.shadowColor='#36f59a';c.shadowBlur=26;c.strokeStyle='#3cf29b';c.lineWidth=5;c.setLineDash([18,10]);rr(x-10,gy-10,w+20,depth+14,10);c.stroke();c.restore();
  // reticle
  const cx=x+w/2,cy=gy+depth*0.4;c.strokeStyle='rgba(60,242,155,.9)';c.lineWidth=3;c.beginPath();c.arc(cx,cy,14,0,7);c.stroke();ln(cx-24,cy,cx-8,cy,'#3cf29b',3);ln(cx+8,cy,cx+24,cy,'#3cf29b',3);ln(cx,cy-24,cx,cy-8,'#3cf29b',3);ln(cx,cy+8,cx,cy+24,'#3cf29b',3);
  if(label){rr(x+w+18,gy+20,96,34,17);c.fillStyle='rgba(12,18,32,.85)';c.fill();txt(`Ø ${(w/46).toFixed(1).replace('.',',')} m`,x+w+66,gy+44,'#3cf29b',19,900,'center');}
}
function swingArc(px,py,r,a){c.save();c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=4;c.setLineDash([10,10]);c.beginPath();c.arc(px,py,r,Math.PI/2-a,Math.PI/2+a);c.stroke();c.restore();
  [[-1],[1]].forEach(([k])=>{const ang=Math.PI/2+k*a,x=px+Math.cos(ang)*r,y=py+Math.sin(ang)*r;ell(x,y,6,6,'#fff');});}
function worker(x,gy,s=1,dir=1,vest='#ff7a1a',step=0){
  c.save();c.translate(x,gy);c.scale(s*dir,s);
  ell(0,4,26,6,'rgba(0,0,0,.3)');
  // legs
  c.strokeStyle='#23324d';c.lineWidth=13;c.lineCap='round';c.beginPath();c.moveTo(-4,-58);c.lineTo(-14+step,-6);c.moveTo(4,-58);c.lineTo(12-step,-6);c.stroke();
  fillR(-22+step,-8,18,9,'#3a2a1c');fillR(4-step,-8,18,9,'#3a2a1c');
  // body vest
  rr(-16,-108,32,54,8);c.fillStyle=lg(-16,0,16,0,[[0,shade(vest,20)],[1,shade(vest,-35)]]);c.fill();
  fillR(-16,-82,32,6,'#e9f0f5');fillR(-16,-68,32,6,'#e9f0f5');
  // arms
  c.strokeStyle=shade(vest,-20);c.lineWidth=10;c.beginPath();c.moveTo(-12,-100);c.lineTo(-22,-66);c.moveTo(12,-100);c.lineTo(24,-70);c.stroke();
  const SK=window.__skin||'#e8b48a',HM=window.__helm||'#ffffff';ell(-22,-64,6,6,SK);ell(24,-68,6,6,SK);
  // head
  ell(0,-122,13,15,SK);
  if(!window.__noHelmet){c.fillStyle=lg(-16,-150,16,-128,[[0,HM],[1,shade(HM,-40)]]);c.beginPath();c.ellipse(0,-130,17,15,0,Math.PI,0);c.fill();fillR(-20,-131,40,5,'#dfe5ea');}else{c.fillStyle='#4a3626';c.beginPath();c.ellipse(0,-130,13,9,0,Math.PI,0);c.fill();}
  c.lineCap='butt';c.restore();
}
function floodlight(x,gy,h,tx,ty,spread=180){
  fillR(x-5,gy-h,10,h,'#2b313a');
  c.save();c.globalCompositeOperation='lighter';
  c.fillStyle=lg(x,gy-h,tx,ty,[[0,'rgba(255,236,170,.45)'],[1,'rgba(255,236,170,0)']]);
  c.beginPath();c.moveTo(x-10,gy-h);c.lineTo(tx-spread,ty+40);c.lineTo(tx+spread,ty+40);c.closePath();c.fill();
  c.fillStyle=rg(tx,ty+20,0,spread*1.1,[[0,'rgba(255,236,170,.35)'],[1,'rgba(255,236,170,0)']]);c.fillRect(tx-spread*1.2,ty-spread,spread*2.4,spread*2);
  c.restore();
  for(let i=0;i<3;i++){withShadow('#fff2c0',30,0,0,()=>{rr(x-30+i*20,gy-h-18,18,14,3);c.fillStyle='#fff6d6';c.fill();});}
}

function startRun(mode, seed, duel) {
  G.mode = mode; G.runSeed = seed; G.run = { levels: runLevels(seed), i: 0, seed, duel: duel || null };
  G.score = 0; G.lives = 3; G.perfects = 0; G.livesLost = 0; G.workersHit = 0; G.checkpoint = G.run.levels[0];
  ON.submitted = false; ON.msg = ''; ON.link = ''; hideOverlay();

}
function afterResult() {
  const r = L.result, ok = r === 'in' || r === 'perfect';
  if (G.mode === 'daily' || G.mode === 'duel') {
    if (ok) { G.run.i++; if (G.run.i >= RUN_LEN) return endRun(true); G.checkpoint = G.run.levels[G.run.i]; return startLevel(G.run.levels[G.run.i]); }
    if (G.lives <= 0) return endRun(false);
    return startLevel(G.level);
  }
  if (ok) {
    if (G.level === 50) { G.endTime = Date.now(); G.screen = 'victory'; save.best = Math.max(save.best || 0, G.score); save.checkpoint = 1; save.score = 0; writeSave(save); return; }
    const next = G.level + 1;
    if (CHECKPOINTS.includes(next)) { save.score = G.score; gotoCheckpointScreen(next); } else startLevel(next);
  } else { if (G.lives <= 0) G.screen = 'gameover'; else startLevel(G.level); }
}

}

async function submitRun() {
  const name = playerName(); if (name.length < 2) { ON.msg = 'Entre un pseudo (2 à 16 caractères).'; return; }

  const body = { name, score: G.score, passed: G.run.passed, perfects: G.perfects, seed: G.run.seed };
  try {
    if (G.mode === 'daily') {
      body.day = todayKey(); const r = await api('/score', { method: 'POST', body: JSON.stringify(body) });
      ON.msg = `Score enregistré · tu es ${r.rank}e sur ${r.total}`; await loadBoard();
    } else if (G.run.duel) {
      const r = await api(`/duel/${G.run.duel.id}/reply`, { method: 'POST', body: JSON.stringify(body) });
      ON.duel = r; const me = G.score, him = r.score;
      ON.msg = me > him ? `Victoire ! ${me.toLocaleString('fr-FR')} contre ${him.toLocaleString('fr-FR')}` : me < him ? `Défaite : ${r.name} garde l'avantage` : 'Égalité parfaite';
    } else {

// l'ancien client REST passe maintenant par la base
async function api(path, opts = {}) {
  const body = opts.body ? JSON.parse(opts.body) : null, method = opts.method || 'GET'; let mt;
  if ((mt = path.match(/^\/leaderboard\?day=(.+)$/))) return { scores: await DB.board(mt[1]) };
  if (path === '/score') return DB.submit(body);
  if (path === '/duel' && method === 'POST') return { id: await DB.createDuel(body) };
  if ((mt = path.match(/^\/duel\/([^/]+)\/reply$/))) return DB.replyDuel(decodeURIComponent(mt[1]), body);
  if ((mt = path.match(/^\/duel\/([^/]+)$/))) return DB.getDuel(decodeURIComponent(mt[1]));
  throw new Error('Route inconnue');
}

// ---------- transport temps réel (Supabase Realtime ou onglets locaux) ----------
const LIVE_EVENTS = ['start', 'state', 'progress', 'done', 'rematch', 'rematchReq'];
function openRoom(code, me, h) {
  if (SB) {
    const ch = SB.channel('pp-' + code, { config: { broadcast: { self: false }, presence: { key: me.id } } });
    LIVE_EVENTS.forEach(ev => ch.on('broadcast', { event: ev }, ({ payload }) => h.msg(ev, payload)));
    ch.on('presence', { event: 'sync' }, () => h.presence(Object.values(ch.presenceState()).map(a => a[0])));
    ch.subscribe(async s => { if (s === 'SUBSCRIBED') { await ch.track(me); h.ready && h.ready(); } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') h.error && h.error('Connexion temps réel impossible'); });
    return { send: (event, payload) => ch.send({ type: 'broadcast', event, payload }), close: () => SB.removeChannel(ch) };
  }
  const bc = new BroadcastChannel('pp-' + code), peers = {};
  const emit = () => { const now = Date.now(); Object.keys(peers).forEach(k => { if (now - peers[k].at > 3500) delete peers[k]; }); h.presence([me, ...Object.values(peers).map(p => p.me)]); };
  bc.onmessage = e => { const d = e.data; if (d.t === 'hb') { const isNew = !peers[d.me.id]; peers[d.me.id] = { me: d.me, at: Date.now() }; if (isNew) { bc.postMessage({ t: 'hb', me }); emit(); } } else if (d.t === 'bye') { delete peers[d.id]; emit(); } else if (d.t === 'msg') h.msg(d.event, d.payload); };
  const hb = () => bc.postMessage({ t: 'hb', me }); hb(); const iv = setInterval(() => { hb(); emit(); }, 1000); setTimeout(() => h.ready && h.ready(), 50);
  return { send: (event, payload) => bc.postMessage({ t: 'msg', event, payload }), close: () => { clearInterval(iv); bc.postMessage({ t: 'bye', id: me.id }); bc.close(); } };
}

// ---------- état du duel en direct ----------
const LV = { room: null, code: '', host: false, me: null, opp: null, phase: 'off', seed: 0, t0: 0, oppProg: null, myDone: false, absentSince: 0, forfeit: false, toast: null, ost: null, odisp: null, msg: '' };

function liveConnect(code, host) {

  LV.room = openRoom(code, LV.me, {
    ready() { if (!host) LV.msg = 'En attente du lancement…'; },
    error(m) { LV.msg = m; },

      else if (LV.phase === 'lobby') LV.opp = null;

    },
    msg(ev, p) {

    const a = len * i / sections * .92, b = i === sections - 1 ? len : len * (i + 1) / sections + 26, w = lerp(w0, w1, i / Math.max(1, sections - 1));
    rr(a, -w / 2, b - a, w, 4); c.fillStyle = lg(0, -w / 2, 0, w / 2, [[0, K.hi], [.45, K.col], [1, K.dark]]); c.fill();

}

const TOASTS = [];
function toast(t, col) { TOASTS.push({ t, col: col || '#3cf29b', at: performance.now() }); }

// ---------- fenêtre de validation (achats en pièces et paiements) ----------
let MO = null;
function modal(o) { MO = o; sfx.click(); }
function purchaseInfo(id) {

  if ((mt = id.match(/^up_(\w+)_(\w+)$/))) { const cost = upgCost(mt[1], mt[2]); if (!cost) return null; const m = modelOf(mt[1], mt[2]); return { name: `Amélioration ${(save.clvl[m.id] || 0) + 1}/3 · ${m.name}`, price: cost }; }
  if (id.startsWith('sk_')) { const sk = SKINS.find(s => s.id === id.slice(3)); if (!sk || save.skins.includes(sk.id)) return null; return sk.shop ? { name: `Peinture ${sk.name}`, shopOnly: true } : { name: `Peinture ${sk.name}`, price: sk.price }; }

  if (id.startsWith('ug_')) { const u = UPGRADES.find(s => s.id === id.slice(3)); if (!u || hasUpg(u.id)) return null; return { name: u.name, price: u.price }; }

}
act = (prev => function (id) {
  if (id === 'mo_no') { MO = null; sfx.click(); return; }

  const info = purchaseInfo(id);
  if (info && !SH.confirmed) {
    if (info.shopOnly) return modal({ title: 'EXCLUSIVITÉ BOUTIQUE', lines: [`${info.name} n'existe que dans le Pack Démarrage.`], yes: 'VOIR LA BOUTIQUE', onYes: () => act('shop') });
    if (save.coins < info.price) return modal({ title: 'PIÈCES INSUFFISANTES', lines: [info.name, `Il te manque ${(info.price - save.coins).toLocaleString('fr-FR')} pièces.`, 'Continue à jouer, ou passe par la boutique.'], yes: 'BOUTIQUE', onYes: () => act('shop'), no: 'PLUS TARD' });
    return modal({ title: 'CONFIRMER L\'ACHAT', lines: [info.name], price: info.price, yes: 'ACHETER', onYes: () => { SH.confirmed = true; try { act(id); } finally { SH.confirmed = false; } } });
  }
  return prev(id);
})(act);
addEventListener('keydown', e => { if (MO && e.key === 'Escape') { MO = null; e.stopImmediatePropagation(); } }, true);

// ---------- paiement Stripe ----------
const SH = { from: 'title', msg: '', busy: false, confirmed: false };
function askPay(o) {
  if (!o) return;
  if (o.once && save.starterBought) return modal({ title: 'DÉJÀ ACHETÉ', lines: ['Le Pack Démarrage ne s\'achète qu\'une fois.'], yes: 'OK', no: null });
  const link = SHOP_LINKS[o.id];
  if (!link || DEMO) return modal({ title: 'BOUTIQUE EN PRÉPARATION', lines: ['Les paiements ne sont pas encore activés.', 'Reviens bientôt !'], yes: 'OK', no: null });
  modal({ title: `${o.name.toUpperCase()} · ${o.euros}`, lines: [`${o.coins.toLocaleString('fr-FR')} pièces${o.item ? ' + peinture Chrome exclusive' : ''}`, 'Paiement sécurisé par Stripe (carte, Apple Pay, Google Pay).', 'Contenu numérique livré tout de suite : tu renonces au délai', 'de rétractation de 14 jours. Mineur ? Demande l\'accord d\'un parent.'], yes: `PAYER ${o.euros}`, no: 'ANNULER',
    onYes: () => { const u = link + (link.includes('?') ? '&' : '?') + 'client_reference_id=' + encodeURIComponent(save.pid); location.href = u; } });
}
async function claimPurchases(manual) {
  if (!SB) { if (manual) toast('Boutique indisponible en mode démo', '#ffb36b'); return 0; }
  try {
    const { data, error } = await SB.rpc('claim_purchases', { p_pid: save.pid }); if (error) throw error;
    const coins = (data && data.coins) || 0, items = (data && data.items) || [];
    if (coins > 0) { save.coins += coins; }
    items.forEach(it => { if (it === 'chrome' && !save.skins.includes('chrome')) save.skins.push('chrome'); if (it === 'chrome') save.starterBought = true; });
    if (coins > 0 || items.length) {
      writeSave(save); SH.msg = ''; sfx.perfect(); setTimeout(() => sfx.win(), 450); CELEB.at = performance.now();
      modal({ title: 'MERCI POUR TON ACHAT ! 🎉', lines: [`+${coins.toLocaleString('fr-FR')} pièces ajoutées${items.includes('chrome') ? ' + peinture Chrome' : ''}`, `Nouveau solde : ${save.coins.toLocaleString('fr-FR')} pièces`, 'Direction le garage pour t\'équiper !'], yes: 'AU GARAGE', no: 'PLUS TARD', onYes: () => { G.screen = 'title'; act('garage'); } });
    }
    else if (manual) modal({ title: 'AUCUN ACHAT EN ATTENTE', lines: ['Tous tes achats sont déjà crédités sur cet appareil.', 'Un paiement peut mettre quelques secondes à arriver :', 'réessaie dans un instant si besoin.'], yes: 'OK', no: null });
    return coins + items.length;
  } catch (e) { if (manual) toast('Serveur indisponible, réessaie plus tard', '#ff5a48'); return 0; }
}
// retour de Stripe : ?achat=ok → on attend que le paiement soit confirmé (quelques secondes)
(function () {
  const q = new URLSearchParams(location.search); if (q.get('achat') !== 'ok') { setTimeout(() => claimPurchases(false), 2500); return; }
  history.replaceState(null, '', location.pathname); G.screen = 'shop'; SH.msg = 'Paiement reçu, crédit des pièces en cours…';
  let n = 0; const tick = async () => { n++; const got = await claimPurchases(false); if (got) { SH.msg = ''; return; } if (n < 15) setTimeout(tick, 2500); else SH.msg = 'Le crédit prend du retard : touche « Restaurer mes achats » dans un moment.'; };
  setTimeout(tick, 1200);
})();

// ---------- écran BOUTIQUE ----------
function coinPile(x, y, n) { const k = [3, 6, 10, 15, 20][n]; for (let i = 0; i < k; i++) { const r = Math.floor(i / 5), cx = x + ((i % 5) - 2) * 22 + (r % 2) * 11, cy = y - r * 14; coinIcon(cx, cy, 16); } }
function drawShop() {

  txt('BOUTIQUE', 960, 92, '#c77dff', 64, 900, 'center');
  button('shopBack', 40, 30, 220, 64, '◀ RETOUR', 'rgba(255,255,255,.2)', 'rgba(255,255,255,.1)', '#fff');
  coinPill(1380, 34);
  txt('Fais avancer ton parc de grues plus vite · les pièces achetées sont créditées sur cet appareil', 960, 150, '#cfe0ff', 21, 700, 'center');
  // pack démarrage
  const st = OFFERS[0], owned = !!save.starterBought;
  rr(110, 190, 1700, 230, 26); c.fillStyle = lg(110, 0, 1810, 0, [[0, 'rgba(199,125,255,.32)'], [1, 'rgba(255,212,71,.22)']]); c.fill(); rr(110, 190, 1700, 230, 26); c.strokeStyle = '#ffd447'; c.lineWidth = 3; c.stroke();
  rr(140, 210, 190, 34, 17); c.fillStyle = '#ffd447'; c.fill(); txt(st.tag, 235, 234, '#2a1a00', 16, 900, 'center');
  txt(st.name.toUpperCase(), 140, 300, '#fff', 44, 900); txt(st.desc, 140, 344, '#ffe6b0', 24, 800); txt('La peinture Chrome ne se gagne pas en jeu.', 140, 382, 'rgba(255,255,255,.7)', 19, 700);
  // aperçu de la flèche chromée
  const sk = SKINS.find(s => s.id === 'chrome'); const sx = 900, sy = 270; fillR(sx, sy, 420, 16, sk.col); fillR(sx, sy + 56, 420, 16, sk.col); c.strokeStyle = sk.dark; c.lineWidth = 4; c.beginPath(); for (let xx = sx; xx < sx + 400; xx += 40) { c.moveTo(xx, sy + 64); c.lineTo(xx + 20, sy + 8); c.lineTo(xx + 40, sy + 64); } c.stroke(); fillR(sx, sy + 4, 420, 3, 'rgba(255,255,255,.8)');

  // packs de pièces

    c.save(); c.beginPath(); c.rect(x, y + 30, w, 200); c.clip(); fillR(x, y + 30, w, 200, rg(x + w / 2, y + 150, 10, 200, [[0, 'rgba(255,212,71,.22)'], [1, 'rgba(255,212,71,0)']])); coinPile(x + w / 2, y + 190, i + 1); c.restore();
    txt(o.name, x + w / 2, y + 268, '#fff', 26, 900, 'center');
    coinIcon(x + w / 2 - 92, y + 314, 20); txt(o.coins.toLocaleString('fr-FR'), x + w / 2 + 12, y + 328, '#ffd447', 44, 900, 'center');
    if (o.bonus) { rr(x + w - 104, y + 40, 84, 34, 17); c.fillStyle = '#3cf29b'; c.fill(); txt(o.bonus, x + w - 62, y + 64, '#06210f', 17, 900, 'center'); }
    smallBtn('of_buy_' + o.id, x + 45, y + 356, w - 90, 64, o.euros, hot ? 'go' : 'buy');
  });
  txt('Paiement sécurisé par Stripe · aucune donnée bancaire ne passe par le jeu · achat définitif', 960, 940, 'rgba(255,255,255,.6)', 18, 700, 'center');
  smallBtn('restore', 760, 965, 400, 56, 'RESTAURER MES ACHATS', 'blue');
  if (SH.msg) txt(SH.msg, 960, 1060, '#ffd447', 20, 800, 'center');

drawOnline = (prev => function () { if (G.screen === 'shop') drawShop(); else prev(); })(drawOnline);

const CELEB = { at: 0 };
// ---------- calque final : fenêtre de validation, notifications, raccourci pièces ----------
function overlayLoop() {
  requestAnimationFrame(overlayLoop);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1;
  // la pastille de pièces ouvre la boutique
  if (!MO && (G.screen === 'title' || G.screen === 'garage')) { const px = G.screen === 'title' ? 40 : 1380, py = G.screen === 'title' ? 36 : 34; c.font = '900 30px Inter'; const w = c.measureText(save.coins.toLocaleString('fr-FR')).width + 86; ell(px + w + 22, py + 30, 22, 22, '#c77dff'); txt('+', px + w + 22, py + 41, '#fff', 30, 900, 'center'); G.buttons.push({ id: 'shop', x: px, y: py, w: w + 46, h: 60 }); }
  if (MO) {
    G.buttons = [];
    const ca = performance.now() - CELEB.at;
    fillR(0, 0, W, H, 'rgba(6,10,20,.72)');
    const lines = MO.lines || [], h = 230 + lines.length * 34 + (MO.price ? 60 : 0), y = 540 - h / 2;
    if (ca < 4000) for (let i = 0; i < 40; i++) { const sx = (i * 197) % W, sy = ((ca / 1000) * (380 + (i % 7) * 60) + i * 53) % (H + 80) - 40; coinIcon(sx, sy, 14 + (i % 3) * 4); }
    rr(560, y, 800, h, 28); c.fillStyle = '#121a2c'; c.fill(); rr(560, y, 800, h, 28); c.strokeStyle = '#ffc21a'; c.lineWidth = 3; c.stroke();
    txt(MO.title, 960, y + 66, '#ffc21a', 34, 900, 'center');
    lines.forEach((l, i) => txt(l, 960, y + 116 + i * 34, i === 0 ? '#fff' : '#cfe0ff', i === 0 ? 26 : 20, i === 0 ? 900 : 700, 'center'));
    if (MO.price) { const py = y + 116 + lines.length * 34 + 20; c.font = '900 40px Inter'; const tw = c.measureText(MO.price.toLocaleString('fr-FR')).width; coinIcon(960 - tw / 2 - 30, py - 13, 20); txt(MO.price.toLocaleString('fr-FR'), 960 + 14, py, '#ffd447', 40, 900, 'center'); txt(`Solde après achat : ${(save.coins - MO.price).toLocaleString('fr-FR')}`, 960, py + 36, '#9fb7cf', 18, 700, 'center'); }
    const by = y + h - 96;
    if (MO.no !== null) { smallBtn('mo_no', 610, by, 330, 70, MO.no || 'ANNULER', 'off'); G.buttons.push({ id: 'mo_no', x: 610, y: by, w: 330, h: 70 }); smallBtn('mo_yes', 980, by, 330, 70, MO.yes || 'OK', 'go'); }
    else smallBtn('mo_yes', 795, by, 330, 70, MO.yes || 'OK', 'go');
  }
  // notifications
  const now = performance.now();
  for (let i = TOASTS.length - 1; i >= 0; i--) if (now - TOASTS[i].at > 3200) TOASTS.splice(i, 1);
  TOASTS.forEach((t, i) => { const age = now - t.at, a = Math.min(1, age / 200, (3200 - age) / 400); c.save(); c.globalAlpha = a; c.font = '900 24px Inter'; const tw = c.measureText(t.t).width + 60, y = 200 + i * 62 - (1 - Math.min(1, age / 200)) * 20; rr(960 - tw / 2, y, tw, 50, 25); c.fillStyle = 'rgba(12,18,32,.94)'; c.fill(); c.strokeStyle = t.col; c.lineWidth = 3; c.stroke(); txt(t.t, 960, y + 34, t.col, 24, 900, 'center'); c.restore(); });
}
// démarre après la boucle principale pour dessiner par-dessus
(function waitFrame() { if (G.t > 0) requestAnimationFrame(overlayLoop); else setTimeout(waitFrame, 200); })();
